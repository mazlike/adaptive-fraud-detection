[project]
name = "adaptive-fraud-detection"
version = "0.1.0"
description = "Adaptive ML pipeline for fraud detection under concept drift and severe class imbalance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "lightgbm>=4.4,<5",
    "river>=0.9,<1",
    "pyyaml>=6.0,<7",
    "typing-extensions>=4.8,<5",
    "matplotlib>=3.8,<4",
    "kagglehub>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
